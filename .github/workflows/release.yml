name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X 'github.com/tamtom/play-console-cli/internal/version.Version=$VERSION'"
          LDFLAGS="$LDFLAGS -X 'github.com/tamtom/play-console-cli/internal/version.Commit=$COMMIT'"
          LDFLAGS="$LDFLAGS -X 'github.com/tamtom/play-console-cli/internal/version.BuildDate=$DATE'"

          BINARY_NAME="gplay-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          go build -trimpath -ldflags "$LDFLAGS" -o "$BINARY_NAME" .

          echo "Built: $BINARY_NAME"

      # Portable-friendly zip for winget: the archive contains gplay.exe so the
      # winget PortableCommandAlias exposes the command as `gplay`.
      - name: Package Windows portable zip
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Copy-Item "gplay-windows-${{ matrix.arch }}.exe" gplay.exe
          Compress-Archive -Path gplay.exe -DestinationPath "gplay-windows-${{ matrix.arch }}.zip" -Force
          Write-Host "Packaged: gplay-windows-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gplay-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            gplay-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
            ${{ matrix.os == 'windows' && format('gplay-windows-{0}.zip', matrix.arch) || '' }}
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-') }}  # Skip pre-releases
    steps:
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Trigger Homebrew tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: tamtom/homebrew-tap
          event-type: update-formula
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'

  winget:
    name: Publish to winget
    needs: release
    runs-on: windows-latest
    if: ${{ !contains(github.ref, '-') }}  # Skip pre-releases
    steps:
      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Submits a manifest-update PR to microsoft/winget-pkgs via wingetcreate.
      # Requires the WINGET_TOKEN secret (classic PAT with a fork of
      # microsoft/winget-pkgs). The package tamtom.gplay must already exist in
      # winget-pkgs (initial manifest submitted once from winget/manifests/).
      - name: Update winget manifest
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "WINGET_TOKEN not set; skipping winget submission."
            exit 0
          }
          $ver = "${{ steps.version.outputs.version }}"
          $url = "https://github.com/tamtom/play-console-cli/releases/download/v$ver/gplay-windows-amd64.zip"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update tamtom.gplay --version $ver --urls "$url" --submit --token $env:WINGET_TOKEN
