name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # A manual run validates a branch before the tag: checks, the five builds,
  # and the installer and upgrade checks. It does not publish a release.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to embed in the rehearsal builds, for example 1.0.0'
        required: true

permissions:
  contents: read

jobs:
  checks:
    name: Validate tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: go install mvdan.cc/gofumpt@v0.12.0
      - run: make format-check check-docs
      - name: Race-enabled test suite and release tool contracts
        run: |
          make test
          python3 -m unittest discover -s scripts/tests
      # The live discovery check (make check-api-drift) stays in the weekly
      # API Drift workflow. It fails on revision-only changes at Google, which
      # must not block a release of an unchanged commit.
      - name: Embedded schema and SDK field coverage
        run: make check-api-schema
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      # govulncheck v1.1.4 uses x/tools v0.29.0. Its SSA builder panics on
      # Go 1.27 code, so the gate failed at random. v1.8.0 supports Go 1.27.
      - name: Reachable vulnerability gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: amd64
            runner: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native installer contracts
        run: python -m unittest discover -s scripts/tests -p test_release_tools.py

      - name: Native updater and terminal contracts
        run: go test ./internal/update ./internal/cli/updatecmd ./cmd -run 'TestSelfUpdateInstallation|TestUpdateInstallerProcess|TestNormalCommandUpdateSuggestion|TestUpdateNotificationProcess|TestDryRunUpdateDoesNotCheckOrInstall' -count=1

      - name: Get version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$INPUT_VERSION
          fi
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
          # verifyupgrade reads the latest release from the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          LDFLAGS="-s -w"
          LDFLAGS="$LDFLAGS -X 'github.com/tamtom/play-console-cli/internal/version.Version=$VERSION'"
          LDFLAGS="$LDFLAGS -X 'github.com/tamtom/play-console-cli/internal/version.Commit=$COMMIT'"
          LDFLAGS="$LDFLAGS -X 'github.com/tamtom/play-console-cli/internal/version.BuildDate=$DATE'"

          BINARY_NAME="gplay-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi

          go build -trimpath -ldflags "$LDFLAGS" -o "$BINARY_NAME" .

          echo "Built: $BINARY_NAME"

          EXPECTED="$VERSION (commit: $COMMIT, date: $DATE)"
          ACTUAL=$(./"$BINARY_NAME" --version)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "release version mismatch: got '$ACTUAL', want '$EXPECTED'" >&2
            exit 1
          fi
          go version -m "$BINARY_NAME"
          go run ./tools/verifyupgrade --candidate "$BINARY_NAME" --version "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gplay-${{ matrix.os }}-${{ matrix.arch }}
          path: gplay-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
          retention-days: 1

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          for asset in gplay-darwin-amd64 gplay-darwin-arm64 gplay-linux-amd64 gplay-linux-arm64 gplay-windows-amd64.exe; do
            test -s "release/$asset"
          done
          test "$(find release -type f | wc -l)" -eq 5

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-') }}  # Skip pre-releases
    steps:
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Trigger Homebrew tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: tamtom/homebrew-tap
          event-type: update-formula
          client-payload: '{"version": "${{ steps.version.outputs.version }}"}'
